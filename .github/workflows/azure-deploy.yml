# ============================================================
# LexiGraph — Azure Container Apps CI/CD Pipeline
#
# Triggers:
#   - Push to main    → run unit tests
#   - PR to main      → run unit + integration tests
#   - Merge to main   → build Docker image, push to ACR, deploy to Azure Container Apps
# ============================================================

name: CI/CD → Azure Container Apps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AZURE_CONTAINER_REGISTRY: lexigraphacr.azurecr.io  # ACR login server
  IMAGE_NAME: lexigraph-backend
  CONTAINER_APP_NAME: lexigraph-api
  RESOURCE_GROUP: lexigraph-rg

jobs:
  # ── 1. Unit Tests (every push) ─────────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run unit tests
        run: bun run test:unit

  # ── 2. Integration Tests (PRs to main only) ────────────────────────────────
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: unit-tests
    env:
      BASE_URL: http://localhost:3000
      PORT: 3000
      AZURE_PG_HOST: ${{ secrets.AZURE_PG_HOST }}
      AZURE_PG_PORT: 5432
      AZURE_PG_DATABASE: lexigraph
      AZURE_PG_USER: ${{ secrets.AZURE_PG_USER }}
      AZURE_PG_PASSWORD: ${{ secrets.AZURE_PG_PASSWORD }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      AZURE_STORAGE_CONTAINER: lexigraph-uploads
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Start server in background
        run: bun run start &

      - name: Wait for server to be ready
        run: |
          for i in {1..20}; do
            curl -sf http://localhost:3000/health && break || sleep 3
          done

      - name: Run integration tests
        run: bun run test:integration

  # ── 3. Build & Deploy to Azure Container Apps (merge to main) ──────────────
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name lexigraphacr

      - name: Build & push Docker image
        run: |
          docker build -t ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .
          docker push ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.AZURE_CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}